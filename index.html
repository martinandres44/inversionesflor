<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Patrimonio Flor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;400;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080c14;
            --surface: #0d1525;
            --surface2: #121d30;
            --surface3: #192338;
            --border: #1e2d45;
            --border-bright: #2a3f5f;
            --text: #e8f0fe;
            --text-muted: #6b82a8;
            --text-dim: #3d5275;
            --accent: #a78bfa;
            --accent-bright: #c4b5fd;
            --accent-dim: rgba(167,139,250,0.15);
            --green: #10b981;
            --green-dim: rgba(16,185,129,0.15);
            --red: #ef4444;
            --usd-color: #34d399;
            --usd-dim: rgba(52,211,153,0.12);
            --ars-color: #60a5fa;
            --ars-dim: rgba(96,165,250,0.12);
            --amber: #f59e0b;
            --slate: #64748b;
            --radius: 12px;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Sora', sans-serif;
            background: var(--bg); color: var(--text);
            margin: 0; padding: 0; font-size: 14px; line-height: 1.5; min-height: 100vh;
        }
        body::before {
            content: ''; position: fixed; inset: 0;
            background-image: linear-gradient(rgba(167,139,250,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(167,139,250,0.025) 1px, transparent 1px);
            background-size: 40px 40px; pointer-events: none; z-index: 0;
        }
        .app { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 16px 14px 60px; }

        /* ── HEADER ── */
        .header {
            background: linear-gradient(135deg, #16102a 0%, #0d0a1a 100%);
            border: 1px solid #2e1f5e; border-radius: 18px;
            padding: 28px 24px 22px; margin-bottom: 16px;
            position: relative; overflow: hidden;
        }
        .header::after {
            content: ''; position: absolute; top: -40px; right: -40px;
            width: 220px; height: 220px;
            background: radial-gradient(circle, rgba(167,139,250,0.15) 0%, transparent 70%);
            pointer-events: none;
        }
        .header-label { font-size: 0.7rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); opacity: 0.8; margin-bottom: 14px; }
        .totals-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 14px; }
        .total-block-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
        .total-block-label.usd { color: var(--usd-color); }
        .total-block-label.ars { color: var(--ars-color); }
        .total-block-val { font-family: 'DM Serif Display', Georgia, serif; font-size: clamp(1.6rem, 5vw, 2.6rem); font-weight: 400; color: #fff; line-height: 1; }
        .total-block-dc { font-family: 'Space Mono', monospace; font-size: 0.73rem; margin-top: 5px; }
        .header-divider { height: 1px; background: #1e1640; margin: 14px 0; }
        .header-meta { display: flex; align-items: center; gap: 12px; }
        #sync-info { font-size: 0.75rem; color: var(--text-muted); }
        .header-refresh { margin-left: auto; background: var(--accent-dim); border: 1px solid rgba(167,139,250,0.3); color: var(--accent-bright); border-radius: 6px; padding: 5px 12px; font-size: 0.75rem; font-weight: 600; cursor: pointer; font-family: 'Sora', sans-serif; }
        .header-refresh:hover { background: rgba(167,139,250,0.25); }

        /* ── FX ROW ── */
        .fx-row { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 16px; margin-bottom: 16px; flex-wrap: wrap; }
        .fx-label { color: var(--text-muted); font-weight: 600; font-size: 0.75rem; letter-spacing: 0.5px; white-space: nowrap; }
        .fx-input { background: var(--surface3); border: 1px solid var(--border-bright); color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: 0.85rem; font-family: 'Space Mono', monospace; width: 140px; text-align: right; }
        .fx-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
        .fx-hint { color: var(--text-dim); font-size: 0.72rem; margin-left: auto; }

        /* ── PILLS ── */
        .summary-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
        .sum-pill { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 12px; text-align: center; }
        .sum-pill-label { font-size: 0.6rem; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 3px; }
        .sum-pill-val { font-family: 'Space Mono', monospace; font-size: 0.68rem; font-weight: 700; }
        .sum-pill-currency { font-size: 0.58rem; color: var(--text-dim); margin-top: 2px; }

        /* ── TABS ── */
        .tabs-nav { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin-bottom: 20px; overflow-x: auto; scrollbar-width: none; }
        .tabs-nav::-webkit-scrollbar { display: none; }
        .tab-btn { flex: 1; min-width: fit-content; white-space: nowrap; padding: 9px 14px; background: transparent; border: none; border-radius: 9px; color: var(--text-muted); font-size: 0.8rem; font-weight: 600; font-family: 'Sora', sans-serif; cursor: pointer; transition: all 0.2s; }
        .tab-btn:hover { color: var(--text); background: var(--surface2); }
        .tab-btn.active { background: var(--accent); color: white; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; animation: fadeSlide 0.25s ease; }
        @keyframes fadeSlide { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

        /* ── CARD ── */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 16px; overflow: hidden; }
        .card-header { padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--surface2); gap: 10px; flex-wrap: wrap; }
        .card-title { font-size: 0.88rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
        .card-accent-bar { width: 3px; height: 16px; border-radius: 2px; flex-shrink: 0; }
        .card-actions { display: flex; align-items: center; gap: 6px; }
        .badge { font-size: 0.62rem; font-weight: 700; padding: 2px 7px; border-radius: 20px; letter-spacing: 0.5px; }
        .badge-usd { background: var(--usd-dim); color: var(--usd-color); border: 1px solid rgba(52,211,153,0.3); }
        .badge-ars { background: var(--ars-dim); color: var(--ars-color); border: 1px solid rgba(96,165,250,0.3); }
        .badge-demo { background: rgba(245,158,11,0.15); color: var(--amber); border: 1px solid rgba(245,158,11,0.3); }

        /* ── TABLE ── */
        .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; }
        th { padding: 9px 14px; text-align: left; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); background: var(--surface); cursor: pointer; white-space: nowrap; border-bottom: 1px solid var(--border); }
        th:hover { color: var(--text-muted); }
        td { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 0.87rem; color: var(--text); }
        tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: rgba(255,255,255,0.02); }
        .mono { font-family: 'Space Mono', monospace; font-size: 0.82rem; white-space: nowrap; }
        .pos { color: var(--green) !important; font-weight: 600; }
        .neg { color: var(--red) !important; font-weight: 600; }
        tfoot td { background: var(--surface2); font-weight: 700; font-size: 0.82rem; border-top: 1px solid var(--border-bright); border-bottom: none; }
        .card-footer { padding: 12px 18px; text-align: right; font-family: 'Space Mono', monospace; font-size: 0.85rem; font-weight: 700; background: var(--surface2); border-top: 1px solid var(--border); color: var(--accent-bright); }

        /* ── INPUTS / BUTTONS ── */
        input.edit-in { background: var(--surface3); border: 1px solid var(--border-bright); color: var(--text) !important; padding: 6px 10px; border-radius: 6px; font-size: 0.85rem; font-family: 'Sora', sans-serif; width: 100%; box-sizing: border-box; }
        input.edit-in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
        .btn-tool { background: none; border: none; cursor: pointer; font-size: 1rem; padding: 4px 6px; border-radius: 6px; color: var(--text-muted); transition: all 0.15s; }
        .btn-tool:hover { background: var(--surface3); color: var(--text); }
        .btn-save { background: var(--accent); color: white; border: none; border-radius: 6px; padding: 6px 12px; font-size: 0.75rem; font-weight: 700; font-family: 'Sora', sans-serif; cursor: pointer; }
        .btn-add { background: var(--green-dim); color: var(--green); border: 1px solid rgba(16,185,129,0.3); border-radius: 6px; padding: 6px 12px; font-size: 0.75rem; font-weight: 700; font-family: 'Sora', sans-serif; cursor: pointer; }
        .btn-del { background: none; border: none; color: var(--red); cursor: pointer; font-size: 1rem; padding: 2px 4px; opacity: 0.7; }
        .btn-del:hover { opacity: 1; }
        .hidden { display: none !important; }

        /* ── MOBILE ── */
        @media (max-width: 640px) {
            .summary-strip { grid-template-columns: repeat(2, 1fr); }
            .tab-btn { padding: 8px 10px; font-size: 0.75rem; }
            .table-wrap { overflow-x: hidden; }
            table, thead, tbody, tfoot, th, td, tr { display: block; }
            thead tr { display: none; }
            tbody tr { margin-bottom: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 12px 14px; }
            tbody td { display: flex; justify-content: space-between; align-items: center; border: none; padding: 5px 0; border-bottom: 1px solid var(--border); gap: 8px; }
            tbody td > * { white-space: nowrap; }
            tbody td.mono span { margin-left: auto; font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; text-align: right; display: inline-block; white-space: nowrap; }
            tbody td:last-child { border-bottom: none; }
            tbody td:first-child { font-size: 1rem; font-weight: 700; padding-bottom: 10px; margin-bottom: 4px; }
            tbody td::before { content: attr(data-label); font-size: 0.65rem; color: var(--text-dim); font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
            tfoot tr { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; border-top: 1px solid var(--border-bright); background: var(--surface2); flex-wrap: wrap; gap: 4px 12px; }
            tfoot td { display: inline-flex; align-items: center; gap: 4px; border: none; padding: 2px 0; background: transparent !important; font-size: 0.8rem; white-space: nowrap; }
            tfoot td[colspan] { flex: 1 1 100%; color: var(--text-muted) !important; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }
            tfoot td:last-child { margin-left: auto; font-weight: 700; }
        }
    </style>
</head>
<body>
<div class="app">

    <!-- HEADER -->
    <div class="header">
        <div class="header-label">Patrimonio Consolidado — Flor 🌸</div>
        <div class="totals-row">
            <div class="total-block">
                <div class="total-block-label usd">Total USD</div>
                <div class="total-block-val" id="total-usd">US$ —</div>
                <div class="total-block-dc" id="dc-usd">—</div>
            </div>
            <div class="total-block">
                <div class="total-block-label ars">≈ Total ARS</div>
                <div class="total-block-val" id="total-ars">$ —</div>
                <div class="total-block-dc" id="dc-ars">—</div>
            </div>
        </div>
        <div class="header-divider"></div>
        <div class="header-meta">
            <div id="sync-info">Prototipo con datos demo</div>
            <button class="header-refresh" onclick="fetchData()">↻ Actualizar</button>
        </div>
    </div>

    <!-- FX ROW -->
    <div class="fx-row">
        <span class="fx-label">💱 USD → ARS</span>
        <input type="text" class="fx-input" id="fx-input"
            onfocus="this.value=fxRate; this.type='number';"
            onblur="this.type='text'; fxRate=parseFloat(this.value)||fxRate; localStorage.setItem('florFxRate',fxRate); this.value=fmtN(fxRate,0); render();"
            onkeydown="if(event.key==='Enter'){this.blur();}">
        <span class="fx-hint">Editá para convertir el total ARS</span>
    </div>

    <!-- PILLS -->
    <div class="summary-strip">
        <div class="sum-pill">
            <div class="sum-pill-label">FCI USD</div>
            <div class="sum-pill-val" id="sum-fci-usd">—</div>
            <div class="sum-pill-currency">USD</div>
        </div>
        <div class="sum-pill">
            <div class="sum-pill-label">FCI ARS</div>
            <div class="sum-pill-val" id="sum-fci-ars">—</div>
            <div class="sum-pill-currency">ARS</div>
        </div>
        <div class="sum-pill">
            <div class="sum-pill-label">Bonos USD</div>
            <div class="sum-pill-val" id="sum-bonos">—</div>
            <div class="sum-pill-currency">USD</div>
        </div>
        <div class="sum-pill">
            <div class="sum-pill-label">Otros USD</div>
            <div class="sum-pill-val" id="sum-otros">—</div>
            <div class="sum-pill-currency">USD</div>
        </div>
    </div>

    <!-- TABS -->
    <div class="tabs-nav">
        <button class="tab-btn active" data-tab="tab-all"     onclick="switchTab(this)">🌐 Todo</button>
        <button class="tab-btn"        data-tab="tab-fci-usd" onclick="switchTab(this)">💵 FCI USD</button>
        <button class="tab-btn"        data-tab="tab-fci-ars" onclick="switchTab(this)">🇦🇷 FCI ARS</button>
        <button class="tab-btn"        data-tab="tab-bonos"   onclick="switchTab(this)">📊 Bonos</button>
        <button class="tab-btn"        data-tab="tab-otros"   onclick="switchTab(this)">💼 Otros</button>
    </div>

    <div id="tab-all"     class="tab-pane active"><div id="all-container"></div></div>
    <div id="tab-fci-usd" class="tab-pane"><div id="fci-usd-container"></div></div>
    <div id="tab-fci-ars" class="tab-pane"><div id="fci-ars-container"></div></div>
    <div id="tab-bonos"   class="tab-pane"><div id="bonos-container"></div></div>
    <div id="tab-otros"   class="tab-pane"><div id="otros-container"></div></div>

</div>
<script>
    // ── DEMO DATA (reemplazar con fetch real) ──
    // FCI ARS: [nombre, cuotas, vcp_ars, dc_v_ars, dc_p]
    const DEMO_FCI_ARS = [
        ["FBA Renta Pesos",    15764.7981, 1.8200,  0.00365,  0.20],
        ["FBA Bonos Argentina",124420.3935,1.4850, -0.00892, -0.60],
    ];
    // FCI USD: [nombre, cuotas, vcp_usd, dc_v_usd, dc_p]
    const DEMO_FCI_USD = [
        ["Balanz Ahorro en Dólares - A",    1975.036, 1.5230,  0.00310,  0.20],
        ["Consultatio Multimercado III - A",1895.489, 1.4870, -0.00521, -0.35],
        ["Schroder Retorno Total - A",      1180.971, 1.6120,  0.00180,  0.11],
        ["FBA Renta Fija Dolar Plus I",     1840.400, 1.5570,  0.00250,  0.16],
    ];
    // Bonos USD: [nombre, cantidad, precio_usd, dc_v_usd, dc_p]
    const DEMO_BONOS = [
        ["AL30", 3.859, 68.50, -1.25, -1.79],
    ];
    // Otros USD: [nombre, monto_usd]
    let otrosData = [
        ["Cuenta Savings", 5000],
        ["Cash USD",        800],
    ];

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz2_lXqHUObQPxtt9nMccpxd56Bw-62OQxX8Cf1DHmWOgE0NbMraSTGoYkw0v_k1syJXA/exec";
    let fxRate = parseFloat(localStorage.getItem('florFxRate')) || 1200;
    let editOtros = false;
    let otrosSort = { key: 'monto', asc: false };

    // ── FORMATTERS ──
    const fmtN   = (v, dec=2) => (v||0).toLocaleString('es-AR',{minimumFractionDigits:dec,maximumFractionDigits:dec});
    const fmtS   = (v, pre='') => v >= 0 ? '\u2002'+pre+fmtN(Math.abs(v)) : '-'+pre+fmtN(Math.abs(v));
    const fmtPct = (v) => v >= 0 ? '\u2002'+fmtN(Math.abs(v))+'%' : fmtN(v)+'%';

    document.getElementById('fx-input').value = fmtN(fxRate, 0);

    function switchTab(btn) {
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
    }

    async function fetchData() {
        // En producción: fetch de la sheet y poblar arrays reales
        // Por ahora usamos demo data
        document.getElementById('sync-info').innerText = "Prototipo · datos demo ⚠️";
        render();
    }

    // ── CARD BUILDERS ──
    function buildFciUsdCard() {
        let tSub=0, tDc=0;
        const rows = DEMO_FCI_USD.map(r => {
            const [n, q, p, dcv, dcp] = r;
            const sub = q * p;
            tSub += sub; tDc += dcv * q;
            return `<tr>
                <td data-label="Fondo">${n}</td>
                <td data-label="Cuotas" class="mono"><span>${fmtN(q,3)}</span></td>
                <td data-label="VCP" class="mono"><span>US$ ${fmtN(p,4)}</span></td>
                <td data-label="Día US$" class="mono ${dcv>=0?'pos':'neg'}"><span>${fmtS(dcv*q,'US$ ')}</span></td>
                <td data-label="Día %" class="mono ${dcp>=0?'pos':'neg'}"><span>${fmtPct(dcp)}</span></td>
                <td data-label="Total" class="mono" style="text-align:right"><span>US$ ${fmtN(sub)}</span></td>
            </tr>`;
        }).join('');
        const pct = tSub ? (tDc/tSub*100) : 0;
        return `<div class="card">
            <div class="card-header">
                <div class="card-title">
                    <div class="card-accent-bar" style="background:var(--usd-color)"></div>
                    💵 FCI Flor — USD
                    <span class="badge badge-usd">USD</span>
                    <span class="badge badge-demo">DEMO</span>
                </div>
            </div>
            <div class="table-wrap"><table>
                <thead><tr><th>Fondo</th><th>Cuotas</th><th>VCP</th><th>Día US$</th><th>Día %</th><th style="text-align:right">Total</th></tr></thead>
                <tbody>${rows}</tbody>
                <tfoot><tr>
                    <td colspan="3" style="text-align:right;color:var(--text-muted)">TOTAL DÍA</td>
                    <td class="mono ${tDc>=0?'pos':'neg'}">US$ ${fmtN(tDc)}</td>
                    <td class="mono ${tDc>=0?'pos':'neg'}">${fmtPct(pct)}</td>
                    <td class="mono" style="text-align:right">US$ ${fmtN(tSub)}</td>
                </tr></tfoot>
            </table></div>
            <div class="card-footer">Subtotal FCI USD: US$ ${fmtN(tSub)}</div>
        </div>`;
    }

    function buildFciArsCard() {
        let tSub=0, tDc=0;
        const rows = DEMO_FCI_ARS.map(r => {
            const [n, q, p, dcv, dcp] = r;
            const sub = q * p;
            tSub += sub; tDc += dcv * q;
            return `<tr>
                <td data-label="Fondo">${n}</td>
                <td data-label="Cuotas" class="mono"><span>${fmtN(q,4)}</span></td>
                <td data-label="VCP" class="mono"><span>$ ${fmtN(p,4)}</span></td>
                <td data-label="Día $" class="mono ${dcv>=0?'pos':'neg'}"><span>${fmtS(dcv*q,'$ ')}</span></td>
                <td data-label="Día %" class="mono ${dcp>=0?'pos':'neg'}"><span>${fmtPct(dcp)}</span></td>
                <td data-label="Total" class="mono" style="text-align:right"><span>$ ${fmtN(sub)}</span></td>
            </tr>`;
        }).join('');
        const pct = tSub ? (tDc/tSub*100) : 0;
        return `<div class="card">
            <div class="card-header">
                <div class="card-title">
                    <div class="card-accent-bar" style="background:var(--ars-color)"></div>
                    🇦🇷 FCI Flor — ARS
                    <span class="badge badge-ars">ARS</span>
                    <span class="badge badge-demo">DEMO</span>
                </div>
            </div>
            <div class="table-wrap"><table>
                <thead><tr><th>Fondo</th><th>Cuotas</th><th>VCP</th><th>Día $</th><th>Día %</th><th style="text-align:right">Total</th></tr></thead>
                <tbody>${rows}</tbody>
                <tfoot><tr>
                    <td colspan="3" style="text-align:right;color:var(--text-muted)">TOTAL DÍA</td>
                    <td class="mono ${tDc>=0?'pos':'neg'}">$ ${fmtN(tDc)}</td>
                    <td class="mono ${tDc>=0?'pos':'neg'}">${fmtPct(pct)}</td>
                    <td class="mono" style="text-align:right">$ ${fmtN(tSub)}</td>
                </tr></tfoot>
            </table></div>
            <div class="card-footer">Subtotal FCI ARS: $ ${fmtN(tSub)}</div>
        </div>`;
    }

    function buildBonosCard() {
        let tSub=0, tDc=0;
        const rows = DEMO_BONOS.map(r => {
            const [n, q, p, dcv, dcp] = r;
            const sub = q * p;
            tSub += sub; tDc += dcv * q;
            return `<tr>
                <td data-label="Bono">${n}</td>
                <td data-label="Cant" class="mono"><span>${fmtN(q,3)}</span></td>
                <td data-label="Precio" class="mono"><span>US$ ${fmtN(p,2)}</span></td>
                <td data-label="Día US$" class="mono ${dcv>=0?'pos':'neg'}"><span>${fmtS(dcv*q,'US$ ')}</span></td>
                <td data-label="Día %" class="mono ${dcp>=0?'pos':'neg'}"><span>${fmtPct(dcp)}</span></td>
                <td data-label="Total" class="mono" style="text-align:right"><span>US$ ${fmtN(sub)}</span></td>
            </tr>`;
        }).join('');
        const pct = tSub ? (tDc/tSub*100) : 0;
        return `<div class="card">
            <div class="card-header">
                <div class="card-title">
                    <div class="card-accent-bar" style="background:var(--amber)"></div>
                    📊 Bonos Flor — USD
                    <span class="badge badge-usd">USD</span>
                    <span class="badge badge-demo">DEMO</span>
                </div>
            </div>
            <div class="table-wrap"><table>
                <thead><tr><th>Bono</th><th>Cant</th><th>Precio</th><th>Día US$</th><th>Día %</th><th style="text-align:right">Total</th></tr></thead>
                <tbody>${rows}</tbody>
                <tfoot><tr>
                    <td colspan="3" style="text-align:right;color:var(--text-muted)">TOTAL DÍA</td>
                    <td class="mono ${tDc>=0?'pos':'neg'}">US$ ${fmtN(tDc)}</td>
                    <td class="mono ${tDc>=0?'pos':'neg'}">${fmtPct(pct)}</td>
                    <td class="mono" style="text-align:right">US$ ${fmtN(tSub)}</td>
                </tr></tfoot>
            </table></div>
            <div class="card-footer">Subtotal Bonos USD: US$ ${fmtN(tSub)}</div>
        </div>`;
    }

    function buildOtrosCard() {
        const sorted = [...otrosData.map((r,i)=>({idx:i,n:r[0],v:r[1]}))].sort((a,b)=>{
            if(otrosSort.key==='nombre') return otrosSort.asc?a.n.localeCompare(b.n):b.n.localeCompare(a.n);
            return otrosSort.asc?a.v-b.v:b.v-a.v;
        });
        let oSub = 0;
        const rows = sorted.map(item => {
            oSub += item.v;
            return `<tr>
                <td data-label="Concepto">${editOtros?`<input class="edit-in" value="${item.n}" onchange="otrosData[${item.idx}][0]=this.value">`:`<b>${item.n}</b>`}</td>
                <td data-label="Monto" class="mono" style="text-align:right">${editOtros?`<input type="number" class="edit-in" style="text-align:right" value="${item.v}" onchange="otrosData[${item.idx}][1]=parseFloat(this.value)||0; render();">`:`<span>US$ ${fmtN(item.v)}</span>`}</td>
                <td class="${editOtros?'':'hidden'}">${editOtros?`<button class="btn-del" onclick="otrosData.splice(${item.idx},1); render();">×</button>`:''}</td>
            </tr>`;
        }).join('');
        return `<div class="card">
            <div class="card-header">
                <div class="card-title">
                    <div class="card-accent-bar" style="background:var(--slate)"></div>
                    💼 Otros — USD
                    <span class="badge badge-usd">USD</span>
                </div>
                <div class="card-actions">
                    ${editOtros?`<button class="btn-add" onclick="otrosData.push(['Nuevo',0]); render();">+ Agregar</button><button class="btn-save" onclick="editOtros=false; render();">Guardar</button>`:''}
                    <button class="btn-tool" onclick="editOtros=!editOtros; render();">✏️</button>
                </div>
            </div>
            <div class="table-wrap"><table>
                <thead><tr>
                    <th onclick="otrosSort.key='nombre';otrosSort.asc=!otrosSort.asc;render()">Concepto ↕</th>
                    <th onclick="otrosSort.key='monto';otrosSort.asc=!otrosSort.asc;render()" style="text-align:right">Monto USD ↕</th>
                    <th class="${editOtros?'':'hidden'}"></th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table></div>
            <div class="card-footer">Subtotal Otros: US$ ${fmtN(oSub)}</div>
        </div>`;
    }

    // ── RENDER ──
    function render() {
        // Compute subtotals
        const fciUsdSub = DEMO_FCI_USD.reduce((s,r)=>s+r[1]*r[2], 0);
        const fciArsSub = DEMO_FCI_ARS.reduce((s,r)=>s+r[1]*r[2], 0);
        const bonosSub  = DEMO_BONOS.reduce((s,r)=>s+r[1]*r[2], 0);
        const otrosSub  = otrosData.reduce((s,r)=>s+(parseFloat(r[1])||0), 0);

        const fciUsdDc  = DEMO_FCI_USD.reduce((s,r)=>s+r[3]*r[1], 0);
        const fciArsDc  = DEMO_FCI_ARS.reduce((s,r)=>s+r[3]*r[1], 0);
        const bonosDc   = DEMO_BONOS.reduce((s,r)=>s+r[3]*r[1], 0);

        // Total USD = FCI USD + Bonos + Otros
        const totalUsd = fciUsdSub + bonosSub + otrosSub;
        const dcUsd    = fciUsdDc + bonosDc;
        // Total ARS = FCI ARS + (total USD * fx)
        const totalArs = fciArsSub + (totalUsd * fxRate);
        const dcArs    = fciArsDc + (dcUsd * fxRate);

        const fciUsdH = buildFciUsdCard();
        const fciArsH = buildFciArsCard();
        const bonosH  = buildBonosCard();
        const otrosH  = buildOtrosCard();

        document.getElementById('all-container').innerHTML     = fciUsdH + fciArsH + bonosH + otrosH;
        document.getElementById('fci-usd-container').innerHTML = fciUsdH;
        document.getElementById('fci-ars-container').innerHTML = fciArsH;
        document.getElementById('bonos-container').innerHTML   = bonosH;
        document.getElementById('otros-container').innerHTML   = otrosH;

        document.getElementById('total-usd').innerText = `US$ ${fmtN(totalUsd)}`;
        document.getElementById('total-ars').innerText = `$ ${fmtN(totalArs)}`;

        const pctUsd = totalUsd ? (dcUsd/totalUsd*100) : 0;
        const pctArs = totalArs ? (dcArs/totalArs*100) : 0;
        document.getElementById('dc-usd').innerHTML = `<span class="${dcUsd>=0?'pos':'neg'}">US$ ${fmtN(dcUsd)} (${fmtN(pctUsd)}%)</span>`;
        document.getElementById('dc-ars').innerHTML = `<span class="${dcArs>=0?'pos':'neg'}">$ ${fmtN(dcArs)} (${fmtN(pctArs)}%)</span>`;

        document.getElementById('sum-fci-usd').innerHTML = `<span>US$ ${fmtN(fciUsdSub)}</span>`;
        document.getElementById('sum-fci-ars').innerHTML = `<span>$ ${fmtN(fciArsSub)}</span>`;
        document.getElementById('sum-bonos').innerHTML   = `<span>US$ ${fmtN(bonosSub)}</span>`;
        document.getElementById('sum-otros').innerHTML   = `<span>US$ ${fmtN(otrosSub)}</span>`;
    }

    fetchData();
    setInterval(fetchData, 60000);
</script>
</body>
</html>
